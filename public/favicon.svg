<!--
  Εικονίδιο καρτέλας: η ίδια ζυγαριά με το λογότυπο της εφαρμογής.

  Το `prefers-color-scheme` μέσα στο SVG κάνει το εικονίδιο σκούρο σε φωτεινό
  θέμα και ανοιχτό σε σκούρο, ώστε να φαίνεται και στις δύο γραμμές καρτελών.
  Οι γραμμές είναι πιο χοντρές από το λογότυπο, γιατί στα 16 εικονοστοιχεία
  μιας καρτέλας μια λεπτή γραμμή εξαφανίζεται.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="#101822" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
  <style>
    @media (prefers-color-scheme: dark) {
      svg { stroke: #e7edf3; }
    }
  </style>
  <path d="M12 3.2v15.4" />
  <path d="M8.4 20.4h7.2" />
  <path d="M9.8 20.4c1.4-.5 1.9-1.1 2.2-1.8.3.7.8 1.3 2.2 1.8" />
